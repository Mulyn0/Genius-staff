name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm install @capacitor/geolocation@^6.0.0
      - run: npx cap add android
      - name: Buat ikon aplikasi
        run: |
          mkdir -p assets && cp icon.png assets/icon.png
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff'
      - run: npx cap sync android
      - name: Set versi
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Build release
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Tanda tangan APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          echo "$KS_B64" | base64 -d > genius.keystore
          BT=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -p -f 4 $IN aligned.apk
          $BT/apksigner sign --ks genius.keystore --ks-pass env:KS_PASS --key-pass env:KS_PASS --ks-key-alias genius --out genius-staf.apk aligned.apk
          $BT/apksigner verify genius-staf.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: GENIUS NET Staf 1.0.${{ github.run_number }}
          files: genius-staf.apk
