<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#281670">
<title>GENIUS NET Staf</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--ink:#1d1633;--mut:#6b6580;--bg:#f6f4fa;--card:#fff;--line:#e4e0ee;--g1:#e8402a;--g2:#f08a24;--g3:#281670;--ok:#1f7a4d}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);padding-top:env(safe-area-inset-top)}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#281670;color:#fff}
.lg{width:40px;height:40px;border-radius:10px;background:#fff;padding:5px;flex:none}.lg img{width:100%;height:100%;object-fit:contain;display:block}
.lgf{background:#fff;border-radius:14px;padding:14px 18px;display:inline-block}.lgf img{width:200px;max-width:60vw;display:block}
header b{display:block;font-size:16px}header small{opacity:.75}
header button{margin-left:auto;background:none;border:1px solid #fff5;color:#fff;border-radius:8px;padding:8px 12px;font-size:14px}
main{flex:1;overflow:auto;padding:16px}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:14px 4px;border:0;background:none;font-size:15px;color:var(--mut);border-top:3px solid transparent}
nav button.on{color:var(--g3);font-weight:700;border-top-color:var(--g3)}
.login{max-width:380px;margin:12vh auto 0;padding:0 20px}
.login h1{font-size:24px;margin:16px 0 4px}.login p{color:var(--mut);margin-bottom:20px}
input{width:100%;padding:14px;border:1px solid var(--line);border-radius:10px;font-size:16px;margin-bottom:12px;background:#fff}
input:focus,button:focus-visible{outline:3px solid #6b2fa055}
.btn{width:100%;padding:14px;border:0;border-radius:10px;background:var(--g3);color:#fff;font-size:16px;font-weight:700}
.err{color:var(--g1);margin:0 0 12px;min-height:1.4em}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat span{display:block;color:var(--mut);font-size:13px}.stat b{font-size:20px}
h2{font-size:15px;color:var(--mut);margin:18px 0 8px;font-weight:600}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.row b{display:block}.row small{color:var(--mut);display:block;word-break:break-word}
nav{overflow-x:auto}nav button{flex:1 0 auto;padding:14px 14px;font-size:14px;white-space:nowrap}
main.mp{padding:0;overflow:hidden;display:flex;flex-direction:column}#map{flex:1;min-height:200px}
.mapbar{font-size:13px;color:var(--mut);padding:6px 12px;background:#fff;border-top:1px solid var(--line)}
.bd{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;margin-left:6px}.bd.on{background:#dff3e8;color:var(--ok)}.bd.off{background:#fde4e0;color:var(--g1)}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:9999}
.sh{background:#fff;width:100%;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0}
.sh b{display:block;margin-bottom:10px}.sh button{display:block;width:100%;padding:14px;margin-bottom:8px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}.sh .gh{border:0;color:var(--mut)}
main.mp{position:relative}
.fab{position:absolute;right:12px;bottom:46px;display:flex;flex-direction:column;gap:8px;z-index:1100}
.fab button{background:var(--g3);color:#fff;border:0;border-radius:99px;padding:12px 18px;font-size:15px;font-weight:700;box-shadow:0 2px 8px #0005}
.odp{background:var(--g3);color:#fff;font:700 11px system-ui;text-align:center;border-radius:4px;padding:2px 0;border:2px solid #fff}
.pb{margin-top:6px;padding:8px 12px;background:var(--g3);color:#fff;border:0;border-radius:8px;font-size:14px}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 70px);left:12px;right:12px;background:#1d1633;color:#fff;padding:10px 14px;border-radius:10px;z-index:10000;text-align:center}
.sh.fm{max-height:88%;overflow:auto}.sh label{display:block;font-size:13px;color:var(--mut);margin:6px 0 4px}
.sh input{margin-bottom:8px}.sh select{width:100%;margin-bottom:8px;border:1px solid var(--line);border-radius:10px;padding:6px;font-size:15px;background:#fff}
.sh .btn{background:var(--g3);color:#fff;border:0;font-weight:700}.lr{display:flex;gap:8px}
.q{margin-bottom:12px}.empty{color:var(--mut);text-align:center;padding:40px 0}
</style></head>
<body><div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const BASE='https://billing.gns.biz.id/api/customer',K='gns_staff';
let S=JSON.parse(localStorage.getItem(K)||'null'),tab=0,Q='';
const TABS={
 admin:[['Ringkasan','/app/admin/dashboard'],['Pelanggan','/app/admin/customers'],['Peta','/app/tech/map/overview','map2'],['ONU','/app/tech/tr069/devices','onu'],['Tiket','/app/admin/tickets'],['Setoran','/app/admin/collector-payments']],
 collector:[['Tagihan','/app/collector/dashboard'],['Peta','/app/collector/customers/map','map'],['Riwayat','/app/collector/history'],['Absen','/app/collector/attendance/today']],
 tech:[['Tugas','/app/tech/dashboard'],['Tiket saya','/tech/tasks'],['ONU','/app/tech/tr069/devices','onu'],['Peta','/app/tech/map/overview','map2'],['Absen','/app/tech/attendance/today']]};
const ROLE={admin:'admin',cashier:'admin',root:'admin',collector:'collector',tech:'tech'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const hum=k=>k.replace(/_/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').replace(/^./,c=>c.toUpperCase());
const money=(k,v)=>typeof v==='number'&&/total|amount|jumlah|revenue|pendapatan|nominal|tagihan|harga|saldo|income|expense/i.test(k)?'Rp '+v.toLocaleString('id-ID'):v;
async function api(path,opt={}){
 const r=await fetch(BASE+path,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+(S?.token||'')}});
 if(r.status===401&&S){logout();throw new Error('Sesi habis, silakan masuk lagi.')}
 const d=await r.json().catch(()=>({}));
 if(!r.ok||d.success===false)throw new Error(d.message||'Gagal memuat data ('+r.status+')');
 return d}
function logout(){S=null;localStorage.removeItem(K);tab=0;Q='';shell()}
async function login(){
 const u=$('#u').value.trim(),p=$('#p').value,e=$('#e');e.textContent='';
 if(!u||!p){e.textContent='Isi username dan password.';return}
 $('#go').disabled=true;$('#go').textContent='Memproses...';
 let d=null,last='Username atau password salah.';
 for(const path of['/auth/login','/tech/login']){
  try{const r=await fetch(BASE+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,loginId:u,password:p})});
   const j=await r.json().catch(()=>({}));
   if(j.success&&j.token){d=j;d.role=j.role||(path==='/tech/login'?'tech':'');d.user=j.user||j.tech||{};break}
   if(j.message)last=j.message}catch(x){last='Tidak bisa terhubung ke server.'}}
 if(!d||!ROLE[d.role]){e.textContent=d?'Peran "'+d.role+'" belum didukung di app staf.':last;$('#go').disabled=false;$('#go').textContent='Masuk';return}
 S={token:d.token,role:ROLE[d.role],name:d.user.name||u};localStorage.setItem(K,JSON.stringify(S));tab=0;shell()}
function unwrap(d){if(d&&typeof d==='object'&&!Array.isArray(d)){const{success,message,...r}=d;const k=Object.keys(r);return k.length===1?r[k[0]]:r}return d}
const sc=v=>v===null||typeof v!=='object';
function stats(o){const e=Object.entries(o).filter(([,v])=>sc(v)&&v!=='');
 return e.length?'<div class="stats">'+e.map(([k,v])=>`<div class="stat"><span>${esc(hum(k))}</span><b>${esc(money(k,v))}</b></div>`).join('')+'</div>':''}
function list(a){
 if(!a.length)return'<div class="empty">Belum ada data.</div>';
 return a.map(it=>{if(sc(it))return`<div class="row"><b>${esc(it)}</b></div>`;
  const t=it.name||it.nama||it.customer_name||it.title||it.subject||it.username||it.invoice_number||('#'+(it.id??''));
  const m=Object.entries(it).filter(([k,v])=>sc(v)&&v!==''&&v!==t&&k!=='id'&&!/pass|token/i.test(k)).slice(0,5).map(([k,v])=>`${esc(hum(k))}: ${esc(money(k,v))}`);
  return`<div class="row" data-s="${esc((t+' '+m.join(' ')).toLowerCase())}"><b>${esc(t)}</b>${m.map(x=>`<small>${x}</small>`).join('')}</div>`}).join('')}
function view(d){d=unwrap(d);
 if(Array.isArray(d))return'<input class="q" id="q" placeholder="Cari..." value="'+esc(Q)+'">'+list(d);
 let h=stats(d);
 for(const[k,v]of Object.entries(d)){if(sc(v))continue;
  h+='<h2>'+esc(hum(k))+'</h2>'+(Array.isArray(v)?list(v):stats(v)||'')}
 return h||'<div class="empty">Belum ada data.</div>'}
let MAP=null,DEV=[],DQ='';
async function post(path,body){try{const r=await api(path,{method:'POST',body:JSON.stringify(body)});alert(r.message||'Berhasil')}catch(e){alert(e.message)}}
function showMap(d){
 const m=$('main'),all=Array.isArray(d.data)?d.data:[];
 if(typeof L==='undefined'){m.innerHTML='<div class="empty">Peta butuh koneksi internet.</div>';return}
 const a=all.filter(c=>isFinite(parseFloat(c.lat))&&isFinite(parseFloat(c.lng))&&(+c.lat||+c.lng));
 m.innerHTML='<div id="map"></div><div class="mapbar">'+a.length+' pelanggan di peta'+(all.length>a.length?', '+(all.length-a.length)+' tanpa koordinat':'')+'. Merah: isolir, oranye: belum bayar.</div>';
 if(MAP){MAP.remove();MAP=null}
 MAP=L.map('map').setView([-2.5,118],5);
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(MAP);
 const pts=[];
 a.forEach(c=>{const lat=+c.lat,lng=+c.lng;
  const col=/suspend|isolat/i.test(c.status||'')?'#d32f2f':c.invoice_status==='unpaid'?'#f08a24':'#6b2fa0';
  L.circleMarker([lat,lng],{radius:9,color:'#fff',weight:2,fillColor:col,fillOpacity:.95}).addTo(MAP).bindPopup(
   '<b>'+esc(c.name)+'</b><br>'+esc(c.address||'')+(c.package_name?'<br>'+esc(c.package_name):'')+(c.invoice_amount?'<br>Tagihan: '+esc(money('amount',+c.invoice_amount)):'')+
   (c.phone?'<br><a href="tel:'+esc(c.phone)+'">'+esc(c.phone)+'</a>':'')+'<br><a href="geo:'+lat+','+lng+'?q='+lat+','+lng+'">Navigasi</a>');
  pts.push([lat,lng])});
 if(pts.length)MAP.fitBounds(pts,{padding:[30,30],maxZoom:17});
 setTimeout(()=>MAP.invalidateSize(),80)}
const devTitle=x=>x.customerName||x.customer?.name||x.customer_name||x.pppoeUsername||x.tag||x.id;
function showOnu(d){
 DEV=Array.isArray(d.data)?d.data:[];
 $('main').innerHTML='<input class="q" id="q" placeholder="Cari nama, serial, PPPoE..." value="'+esc(DQ)+'"><div id="dl"></div>';
 $('#q').oninput=e=>{DQ=e.target.value.toLowerCase();drawOnu(d.message)};drawOnu(d.message)}
function drawOnu(msg){
 const f=DEV.filter(x=>!DQ||JSON.stringify(x).toLowerCase().includes(DQ));
 $('#dl').innerHTML=f.length?(f.length>100?'<small style="color:var(--mut)">Menampilkan 100 dari '+f.length+'. Persempit pencarian.</small>':'')+f.slice(0,100).map(x=>{
  const on=/online/i.test(x.status||'');
  const meta=Object.entries(x).filter(([k,v])=>sc(v)&&v!==''&&!/^(id|tag|status)$/.test(k)&&!/pass|token/i.test(k)).slice(0,5).map(([k,v])=>`<small>${esc(hum(k))}: ${esc(v)}</small>`).join('');
  return`<div class="row" data-i="${DEV.indexOf(x)}"><b>${esc(devTitle(x))}<span class="bd ${on?'on':'off'}">${esc(x.status||'-')}</span></b>${meta}</div>`}).join(''):'<div class="empty">'+esc(msg||'Perangkat tidak ditemukan.')+'</div>';
 document.querySelectorAll('#dl .row').forEach(r=>r.onclick=()=>actOnu(DEV[+r.dataset.i]))}
function actOnu(x){
 const tag=x.tag||x.id,t=devTitle(x),u=x.pppoeUsername||x.pppoe_username,o=document.createElement('div');o.className='ov';
 o.innerHTML=`<div class="sh"><b>${esc(t)}</b><button data-a="s">Ganti nama WiFi</button><button data-a="p">Ganti password WiFi</button><button data-a="r">Reboot ONU</button>${u?'<button data-a="k">Putus sesi PPPoE</button>':''}<button data-a="x" class="gh">Batal</button></div>`;
 document.body.appendChild(o);
 o.onclick=e=>{const a=e.target.dataset&&e.target.dataset.a;
  if(e.target===o||a==='x'){o.remove();return}if(!a)return;o.remove();
  if(a==='s'){const v=prompt('Nama WiFi baru:');if(v)post('/app/tech/tr069/device/ssid',{tag,ssid:v.trim()})}
  if(a==='p'){const v=prompt('Password WiFi baru (minimal 8 karakter):');if(v&&v.length<8)alert('Minimal 8 karakter.');else if(v)post('/app/tech/tr069/device/password',{tag,password:v})}
  if(a==='r'&&confirm('Reboot ONU '+t+'?'))post('/app/tech/tr069/device/reboot',{tag});
  if(a==='k'&&confirm('Putus sesi PPPoE '+u+'?'))post('/app/tech/mikrotik/secret/kick',{username:u})}}
let PICK=null,MC={};
const toast=t=>{let e=$('#toast');if(!t){e&&e.remove();return}if(!e){e=document.createElement('div');e.id='toast';document.body.appendChild(e)}e.textContent=t};
function gps(){return new Promise((ok,no)=>{
 const C=window.Capacitor,G=C&&C.isNativePlatform&&C.isNativePlatform()?C.registerPlugin('Geolocation'):null;
 if(G)G.getCurrentPosition({enableHighAccuracy:true,timeout:20000}).then(p=>ok([p.coords.latitude,p.coords.longitude]),e=>no(new Error('GPS gagal: '+(e.message||e))));
 else if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>ok([p.coords.latitude,p.coords.longitude]),e=>no(new Error('GPS gagal: '+e.message)),{enableHighAccuracy:true,timeout:20000});
 else no(new Error('GPS tidak tersedia.'))})}
function ov(h,save){
 const o=document.createElement('div');o.className='ov';
 o.innerHTML='<div class="sh fm">'+h+'<label>Lokasi</label><div class="lr"><input id="f_lat" placeholder="Latitude" inputmode="decimal"><input id="f_lng" placeholder="Longitude" inputmode="decimal"></div><button data-a="g">Ambil lokasi GPS saya</button><button data-a="m">Pilih titik di peta</button><div class="err" id="fe"></div><button class="btn" data-a="s">Simpan</button><button class="gh" data-a="x">Batal</button></div>';
 document.body.appendChild(o);
 const q=i=>o.querySelector('#f_'+i),fe=o.querySelector('#fe');
 o.onclick=async e=>{const a=e.target.dataset&&e.target.dataset.a;if(!a)return;fe.textContent='';
  if(a==='x')o.remove();
  if(a==='g'){fe.textContent='Mencari lokasi...';try{const p=await gps();q('lat').value=p[0].toFixed(6);q('lng').value=p[1].toFixed(6);fe.textContent=''}catch(x){fe.textContent=x.message}}
  if(a==='m'){o.style.display='none';toast('Ketuk lokasi di peta');PICK=(la,ln)=>{q('lat').value=la.toFixed(6);q('lng').value=ln.toFixed(6);o.style.display='';toast('')}}
  if(a==='s'){e.target.disabled=true;try{await save(q,o)}catch(x){fe.textContent=x.message}e.target.disabled=false}};
 return o}
function formOdp(){
 ov('<b>Tambah ODP</b><label>Nama ODP</label><input id="f_name"><label>Jumlah port</label><input id="f_cap" inputmode="numeric" value="16"><label>PON port (opsional)</label><input id="f_pon"><label>Keterangan (opsional)</label><input id="f_desc">',async(q,o)=>{
  if(!q('name').value.trim())throw new Error('Nama ODP wajib diisi.');
  if(!q('lat').value||!q('lng').value)throw new Error('Lokasi belum diisi.');
  const r=await api('/app/tech/odps/create',{method:'POST',body:JSON.stringify({name:q('name').value,port_capacity:q('cap').value,pon_port:q('pon').value,description:q('desc').value,lat:q('lat').value,lng:q('lng').value})});
  alert(r.message);o.remove();load()})}
function formOnt(odps){
 let devs=[],tm;
 const o=ov('<b>Catat ONT pelanggan</b><label>Pelanggan</label><input id="f_cq" placeholder="Cari nama / PPPoE / HP"><select id="f_cust" size="4"></select><label>Perangkat ONU</label><input id="f_dq" placeholder="Cari serial / nama"><select id="f_dev" size="4"><option value="">Memuat perangkat...</option></select><label>ODP</label><select id="f_odp"><option value="">- tidak dipilih -</option>'+odps.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select><label>Port ODP</label><input id="f_port" inputmode="numeric">',async(q,o)=>{
  const cid=q('cust').value;if(!cid)throw new Error('Pilih pelanggan dulu.');
  const ds=q('dev').selectedOptions[0];
  const r=await api('/app/tech/customers/ont',{method:'POST',body:JSON.stringify({customerId:+cid,tag:q('dev').value,serial:(ds&&ds.dataset.s)||'',odp_id:q('odp').value,odp_port:q('port').value,lat:q('lat').value,lng:q('lng').value})});
  alert(r.message);o.remove();load()});
 const q=i=>o.querySelector('#f_'+i);
 q('cq').oninput=()=>{clearTimeout(tm);tm=setTimeout(async()=>{const v=q('cq').value.trim();if(v.length<2)return;
  try{const r=await api('/app/tech/customers/search?q='+encodeURIComponent(v));q('cust').innerHTML=(r.data||[]).map(c=>'<option value="'+c.id+'">'+esc(c.name)+(c.pppoe_username?' · '+esc(c.pppoe_username):'')+'</option>').join('')||'<option value="">Tidak ditemukan</option>'}catch(e){}},350)};
 const drawD=()=>{const v=q('dq').value.toLowerCase();q('dev').innerHTML=devs.filter(x=>!v||JSON.stringify(x).toLowerCase().includes(v)).slice(0,40).map(x=>'<option value="'+esc(x.tag||x.id)+'" data-s="'+esc(x.serialNumber||'')+'">'+esc((x.serialNumber||x.tag)+' · '+(x.status||'-')+(x.customerName?' · '+x.customerName:''))+'</option>').join('')||'<option value="">Perangkat tidak ditemukan</option>'};
 q('dq').oninput=drawD;
 api('/app/tech/tr069/devices').then(r=>{devs=Array.isArray(r.data)?r.data:[];drawD()}).catch(e=>{q('dev').innerHTML='<option value="">'+esc(e.message)+'</option>'})}
window.mapOnu=id=>{const c=MC[id];if(c)actOnu({tag:c.genieacs_tag,customerName:c.name,pppoeUsername:c.pppoe_username})};
function showMap2(d){
 const m=$('main'),cs=d.customers||[],os=d.odps||[];
 if(typeof L==='undefined'){m.innerHTML='<div class="empty">Peta butuh koneksi internet.</div>';return}
 m.innerHTML='<div id="map"></div><div class="fab"><button id="aO">+ ODP</button><button id="aT">+ ONT</button></div><div class="mapbar">'+cs.length+' pelanggan, '+os.length+' ODP. Hijau: ONU online, merah: offline, abu: ONU belum terhubung.</div>';
 if(MAP){MAP.remove();MAP=null}
 MAP=L.map('map').setView([-2.5,118],5);
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(MAP);
 const ok=(a,b)=>isFinite(parseFloat(a))&&isFinite(parseFloat(b)),pts=[],OD={};
 os.filter(o=>ok(o.lat,o.lng)).forEach(o=>{OD[o.id]=[+o.lat,+o.lng];
  L.marker(OD[o.id],{icon:L.divIcon({className:'',html:'<div class="odp">ODP</div>',iconSize:[34,20],iconAnchor:[17,10]})}).addTo(MAP)
   .bindPopup('<b>'+esc(o.name)+'</b><br>Terpakai '+o.used+' / '+(o.port_capacity||'-')+' port'+(o.description?'<br>'+esc(o.description):''));pts.push(OD[o.id])});
 MC={};
 cs.filter(c=>ok(c.lat,c.lng)).forEach(c=>{MC[c.id]=c;const p=[+c.lat,+c.lng];
  const col=c.onu==='online'?'#1f7a4d':c.onu==='offline'?'#d32f2f':'#8a8599';
  if(c.odp_id&&OD[c.odp_id]){let mid=[];try{const j=JSON.parse(c.cable_path);if(Array.isArray(j))mid=j.map(x=>Array.isArray(x)?[+x[0],+x[1]]:[+x.lat,+x.lng]).filter(x=>ok(x[0],x[1]))}catch(e){}
   L.polyline([OD[c.odp_id],...mid,p],{color:'#281670',weight:2,opacity:.45,dashArray:'4 4'}).addTo(MAP)}
  L.circleMarker(p,{radius:8,color:'#fff',weight:2,fillColor:col,fillOpacity:.95}).addTo(MAP).bindPopup(
   '<b>'+esc(c.name)+'</b><br>'+esc(c.address||'')+'<br>ONU: '+esc(c.onu)+(c.phone?'<br><a href="tel:'+esc(c.phone)+'">'+esc(c.phone)+'</a>':'')+
   (c.genieacs_tag?'<br><button class="pb" onclick="mapOnu('+c.id+')">Menu ONU</button>':'')+'<br><a href="geo:'+p[0]+','+p[1]+'?q='+p[0]+','+p[1]+'">Navigasi</a>');pts.push(p)});
